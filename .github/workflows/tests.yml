name: FastExpress QA

on:
  push:
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'backend[dev]'
      - run: pytest backend/tests/unit -q

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'backend[dev]'
      - run: pytest backend/tests/integration -q

  backend-stress:
    name: Backend stress tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'backend[dev]'
      - run: pytest backend/tests/stress -m stress -q

  frontend-unit-ui-snapshot-stress:
    name: Frontend unit, UI, snapshot and stress tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - run: npm run test:snapshot
        working-directory: frontend
      - run: npm run test:stress
        working-directory: frontend

  all:
    name: Full coverage gate
    needs: [backend-unit, backend-integration, backend-stress, frontend-unit-ui-snapshot-stress]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Todos los targets de QA finalizaron correctamente"
